name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PHP_VERSION: 8.2

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # php-actions/* are kept from the upstream pipeline: they are the setup this
      # test suite is known to pass under, and the intl extension is required.
      - uses: php-actions/composer@8a65f0d3c6a1d17ca4800491a40b5756a4c164f3 # v6.1.2
        with:
          php_extensions: intl
          php_version: ${{ env.PHP_VERSION }}
      - name: PHPUnit
        uses: php-actions/phpunit@1789d1964b1bfda259b1cb42a72b65299c2cae35 # v4
        with:
          php_extensions: intl
          php_version: ${{ env.PHP_VERSION }}
          bootstrap: vendor/autoload.php
          configuration: tests/phpunit/phpunit.xml
          args: --testdox
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
