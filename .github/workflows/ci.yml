name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PHP_VERSION: 8.2

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # php-actions/* are kept from the upstream pipeline: they are the setup this
      # test suite is known to pass under, and the intl extension is required.
      - uses: php-actions/composer@v6
        with:
          php_extensions: intl
          php_version: ${{ env.PHP_VERSION }}
      - name: PHPUnit
        uses: php-actions/phpunit@v4
        with:
          php_extensions: intl
          php_version: ${{ env.PHP_VERSION }}
          bootstrap: vendor/autoload.php
          configuration: tests/phpunit/phpunit.xml
          args: --testdox
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
