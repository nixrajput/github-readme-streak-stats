name: Translation progress

# Regenerates the translation completeness table in the README when a locale
# changes. Worth keeping: the service ships 63 locales and the table rots silently
# otherwise.
#
# Raises a PR rather than committing to the default branch. The bot is not a repo
# admin, so branch protection rejects a direct push (403) - which is exactly how the
# upstream version of this workflow failed here.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "api/translations.php"
      - "scripts/translation-progress.php"
      - ".github/workflows/translation-progress.yml"

permissions:
  contents: write
  pull-requests: write

env:
  PHP_VERSION: 8.2

jobs:
  translation-progress:
    name: translation progress
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: php-actions/composer@v6
        with:
          php_extensions: intl
          php_version: ${{ env.PHP_VERSION }}

      - name: Regenerate the progress table
        run: php scripts/translation-progress.php

      - name: Raise a PR if the table changed
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "docs(readme): update translation progress"
          title: "docs(readme): update translation progress"
          body: |
            Regenerated by the `Translation progress` workflow after a locale change.

            Only the block between the `TRANSLATION_PROGRESS` markers in `README.md`
            is touched. Merge if the diff is limited to that table.
          branch: chore/translation-progress
          delete-branch: true
          add-paths: README.md
